version: 2

models:
  - name: stg_employee_assignements
    description: Project assignment records. One row per employee-project assignment.
    columns:
      - name: assignment_id
        description: Unique assignment identifier.
        data_tests:
          - unique
          - not_null_empty_string

      - name: employee_id
        description: Employee ID assigned to the project.
        data_tests:
          - not_null_empty_string
          - relationships:
              arguments:
                to: ref('stg_employees')
                field: employee_id

      - name: project_code
        description: Project code.

      - name: project_name
        description: Project name.

      - name: assignment_role
        description: Employee's role on the assignment.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Lead', 'Consultant', 'Contributor', 'Reviewer']
          - not_null_empty_string

      - name: assignment_start_date
        description: Date the assignment started.

      - name: assignment_weekly_hours
        description: Weekly hours allocated to the assignment.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: is_assignment_billable
        description: True if the source billable flag is any shape of "yes", false if any shape of "no", null otherwise.

      - name: reference_date
        description: Date the source export was generated, as recorded in the raw file.
